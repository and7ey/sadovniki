<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Квартира — 3D</title>
  <link rel="stylesheet" href="./src/style.css?v=20" />
</head>
<body>
  <div id="app"></div>

  <div class="hud">
    <div class="top-left">
      <section class="weather" id="weather" data-entity="weather.home">
        <div class="weather-icon" id="weather-icon">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.6 34h20a6.6 6.6 0 0 0 .5-13.17 9.7 9.7 0 0 0-18.5-1.1A6.9 6.9 0 0 0 13.6 34Z" />
          </svg>
        </div>
        <div class="weather-body">
          <div class="weather-temp" id="weather-temp">8 °C</div>
          <div class="weather-state" id="weather-state">Облачно</div>
        </div>
      </section>

      <section class="weather climate" id="climate-card">
        <div class="weather-icon" id="climate-icon">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M24 12a4 4 0 0 1 4 4v13a6 6 0 1 1-8 0V16a4 4 0 0 1 4-4Z" />
            <path d="M24 22v9" />
          </svg>
        </div>
        <div class="weather-body">
          <div class="weather-temp" id="climate-temp">24°</div>
          <div class="weather-state" id="climate-state">в квартире</div>
        </div>
      </section>
    </div>

    <div class="room-actions" id="room-actions" hidden>
      <button id="btn-room-track" class="big-square" title="Трек — включить/выключить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20h16" /><path d="M8 20V9l4-3 4 3v11" /><path d="M10.6 20v-4.4h2.8V20" />
        </svg>
      </button>
      <button id="btn-room-led" class="big-square" title="Лента — включить/выключить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 8.5h13L20.5 12l-4 3.5h-13Z" /><path d="M7 8.5v7M11 8.5v7M15 8.5v7" />
        </svg>
      </button>
    </div>

    <button id="btn-all-off" class="big-square all-off" title="Выключить весь свет в квартире" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 17h6M10 20h4" /><path d="M12 3.5a6 6 0 0 0-3.6 10.8c.5.4.8 1 .8 1.6v1.1h5.6v-1.1c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3.5Z" />
        <path d="M4.5 4.5 19.5 19.5" />
      </svg>
    </button>

    <div id="callouts" class="callouts"></div>

    <div class="side-stack">
      <button id="btn-rotate" title="Автовращение"></button>
      <button id="btn-walls" title="Показать/скрыть стены"></button>
      <button id="btn-light" title="Освещение: день / вечер / ночь"></button>
      <button id="btn-view" title="Вид сверху / вернуть камеру"></button>
      <button id="btn-home" class="home-btn" title="Вернуть общий вид квартиры" aria-label="Общий вид">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.6" />
          <path d="M15.6 8.4 13.3 13.3 8.4 15.6 10.7 10.7Z" fill="currentColor" stroke="none" />
          <path d="M12 2.6v1.8M12 19.6v1.8M2.6 12h1.8M19.6 12h1.8" />
        </svg>
      </button>
    </div>

    <div id="device-sheet" class="sheet" hidden>
      <div class="sheet-head">
        <span class="sheet-icon" id="sheet-icon"></span>
        <span class="sheet-title" id="sheet-title">Кондиционер</span>
        <button class="switch" id="sheet-toggle" role="switch" aria-checked="false"><span></span></button>
      </div>
      <div class="sheet-body">
        <button class="round" id="sheet-minus" aria-label="Меньше">−</button>
        <div class="sheet-value">
          <div class="sheet-target" id="sheet-target">24,5°</div>
          <div class="sheet-current" id="sheet-current">спальня 26,5°</div>
        </div>
        <button class="round" id="sheet-plus" aria-label="Больше">+</button>
      </div>
    </div>
  </div>

  <div id="gl-lost" class="gl-lost" hidden>
    <p>Не хватило памяти видеокарты для этой сцены.</p>
    <button type="button" onclick="location.reload()">Перезагрузить</button>
  </div>

  <div id="loader">
    <div class="loader-inner">
      <div class="loader-ring"></div>
      <div class="loader-text">Загружаем квартиру… <span id="progress">0%</span></div>
    </div>
  </div>

  <script>
    // ошибки, которые рушат загрузку, показываем прямо в лоадере
    window.addEventListener('error', (e) => {
      const t = document.querySelector('.loader-text');
      if (t) t.textContent = 'Ошибка: ' + (e.message || 'сбой загрузки') + ' @ ' + (e.filename || '').split('/').slice(-2).join('/') + ':' + (e.lineno || 0);
    });
    window.addEventListener('unhandledrejection', (e) => {
      const t = document.querySelector('.loader-text');
      const m = e.reason && e.reason.message ? e.reason.message : 'сбой загрузки';
      if (t) t.textContent = 'Ошибка: ' + m;
    });
  </script>
  <script type="module" src="./src/main.js?v=81"></script>
</body>
</html>
